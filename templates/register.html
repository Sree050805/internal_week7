<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form</title>
    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }
        input{
            width:160px;
            float:right;
            margin-left:15px;
        }
    </style>
</head>
<body>
    <h2>Registration Form</h2>
    <form method="POST">
        Name: <input type="text" name="name" required><br><br>
        Roll No: <input type="text" name="rollno" required><br><br>
        Year: <input type="number" name="year" required><br><br>
        Branch: <input type="text" name="branch" required><br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
